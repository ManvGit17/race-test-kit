[project]
name = "pytest-racekit"
version = "0.1.1"
description = "Race testing for live services: release many requests from one starting gate, repeat for many rounds, and count the rounds that broke a database invariant."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "ManvGit17" }]
keywords = ["pytest", "race-condition", "concurrency", "testing", "postgresql", "idempotency", "httpx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ManvGit17/race-test-kit"
Source = "https://github.com/ManvGit17/race-test-kit"
Issues = "https://github.com/ManvGit17/race-test-kit/issues"
Documentation = "https://github.com/ManvGit17/race-test-kit/tree/main/docs"
Changelog = "https://github.com/ManvGit17/race-test-kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
racekit = "racekit.cli:main"

[project.entry-points.pytest11]
racekit = "racekit.pytest_plugin"

[dependency-groups]
dev = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "mypy==2.4.1",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.9",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "racekit"

[tool.ruff]
line-length = 100
target-version = "py311"
# PLAN.md and CLAUDE.md are local-only (gitignored); listed here because ruff only reads
# .gitignore inside a git repository.
extend-exclude = ["research", "PLAN.md", "CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "bench", "examples", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/shop/tests"]
addopts = ["-ra", "--strict-markers"]
